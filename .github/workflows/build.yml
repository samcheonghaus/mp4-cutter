name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Copy bundled ffmpeg
        run: python -c "import imageio_ffmpeg, shutil; shutil.copy(imageio_ffmpeg.get_ffmpeg_exe(), 'ffmpeg.exe')"
      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --windowed --name MP4Cutter --add-binary "ffmpeg.exe;." mp4cutter.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MP4Cutter-windows
          path: dist/MP4Cutter.exe
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MP4Cutter.exe
